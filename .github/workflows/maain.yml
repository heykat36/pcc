name: RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360   # limite máximo de um runner hospedado pelo GitHub

    steps:
      - name: Configurar RDP e desempenho
        shell: pwsh
        run: |
          # Habilita o Remote Desktop (mantém o NLA ligado: mais seguro)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force

          # Libera a porta 3389 SOMENTE para a rede do Tailscale (100.64.0.0/10)
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          # Plano de energia: Alto Desempenho
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

          Restart-Service -Name TermService -Force

      - name: Otimizar efeitos visuais
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'DragFullWindows' -Value '0'
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'MenuShowDelay' -Value '0'
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'UserPreferencesMask' -Value ([byte[]](144,18,3,128,16,0,0,0))
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name 'MinAnimate' -Value '0'
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2

      - name: Criar usuário RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            Write-Error "Crie o secret RDP_PASSWORD no repositório (Settings > Secrets > Actions)."
            exit 1
          }
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) { Remove-LocalUser -Name "RDP" }
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires -FullName "RDP User" | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            Write-Error "Falha ao criar o usuário"; exit 1
          }

      - name: Instalar Roblox Studio
        shell: pwsh
        run: |
          $installer = "$env:TEMP\RobloxStudioLauncherBeta.exe"
          Invoke-WebRequest -Uri "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe" -OutFile $installer
          Start-Process -FilePath $installer

          # Espera o Studio aparecer na pasta de instalação (até 5 min)
          $found = $false
          for ($i = 0; $i -lt 60; $i++) {
            if (Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions" -Recurse -Filter "RobloxStudioBeta.exe" -ErrorAction SilentlyContinue) {
              $found = $true; break
            }
            Start-Sleep -Seconds 5
          }
          if ($found) { Write-Host "Roblox Studio instalado." } else { Write-Warning "Studio não apareceu a tempo; instale manualmente pelo RDP." }

      - name: Instalar Tailscale
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait
          Remove-Item $installer -Force

      - name: Conectar ao Tailscale
        shell: pwsh
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=$env:TS_KEY --hostname="gh-runner-$env:GITHUB_RUN_ID" --accept-dns=false --unattended

          $tsIP = $null
          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
            $tsIP = (& $ts ip -4) | Select-Object -First 1
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) { Write-Error "IP do Tailscale não atribuído."; exit 1 }
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verificar RDP
        shell: pwsh
        run: |
          $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $r.TcpTestSucceeded) { Write-Error "Porta 3389 inacessível"; exit 1 }
          Write-Host "RDP respondendo."

      - name: Manter conectado
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "RDP PRONTO"
          Write-Host "Endereço : $env:TAILSCALE_IP"
          Write-Host "Usuário  : RDP"
          Write-Host "Senha    : (o secret RDP_PASSWORD)"
          Write-Host "========================================"
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP ativo. Use 'Cancel workflow' para encerrar."
            Start-Sleep -Seconds 300
          }
